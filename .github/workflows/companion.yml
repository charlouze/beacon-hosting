name: companion

# A git tag, and nothing else. §10: publishing an image is one of the two paths
# that has no review, so it is deliberately a gesture and never a side effect of
# a merge.
on:
  push:
    tags: ['companion-v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# `contents: write` to push the branch that re-pins the digest, and nothing
# more: this workflow opens no pull request, so it needs no right over them.
permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx nx build companion

      # The barrier (§10). The image does not leave the runner if the round trip
      # or the refusal of an empty archive does not hold.
      - run: npx nx run companion:smoke

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `companion-v1` names the git tag, where the prefix says which artefact
      # of the repository is being published. The image is already called
      # beacon-companion, so carrying the prefix over would read
      # `beacon-companion:companion-v1`. The trigger above only ever fires on
      # `companion-v*`, so stripping it is total and needs no fallback.
      - id: version
        run: echo "value=${GITHUB_REF_NAME#companion-v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: push
        with:
          context: deploy/companion
          push: true
          tags: ghcr.io/charlouze/beacon-companion:${{ steps.version.outputs.value }}

      # The digest is what the cloud-init references, never the tag.
      - run: echo "digest ${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

      # Read from `main` and never from the tag's commit: what production
      # renders is `main`'s catalogue, so `main`'s line is the only one worth
      # comparing. A tag posted on an older commit would otherwise compare
      # against a digest nothing deploys.
      - id: pinned
        run: |
          git fetch --depth=1 origin main
          value=$(git show origin/main:deploy/cloud-init/src/lib/companion-image.ts |
            grep -o 'sha256:[0-9a-f]\{64\}')
          echo "value=$value" >> "$GITHUB_OUTPUT"

      # Publishing the same bytes twice is the ordinary case of a re-run: no
      # pull request, because there is nothing to change.
      - if: steps.pinned.outputs.value == steps.push.outputs.digest
        run: echo "catalogue already pins this digest, nothing to open" >> "$GITHUB_STEP_SUMMARY"

      # The step that closes the gap this project paid for once: a companion was
      # published, the catalogue kept pinning the previous image, and a Function
      # that already expected the new report met the old companion. Every
      # Sunkenland session stayed `provisioning` until someone thought of the one
      # line nobody had been told to change.
      #
      # It pushes a branch and stops there. It does not open the pull request,
      # and does not push to `main`: the merge stays the deployment and stays a
      # human's decision (§10). What disappears is the copy-paste, never the gate.
      #
      # Why the human opens it, rather than this workflow — two reasons, and the
      # first was learned the hard way on `companion-v0.5`:
      #
      #   1. `gh pr create` failed with "GitHub Actions is not permitted to
      #      create or approve pull requests", a repository setting that is off
      #      by default. The image was already published by then, so the run went
      #      red on a job that had done its work.
      #   2. A pull request opened by the `GITHUB_TOKEN` does not trigger
      #      `pull_request` workflows, so `verify` — a required check — would
      #      never run on it and the merge button would stay blocked until a
      #      human closed and reopened it.
      #
      # Opened by a human, both problems are gone: no setting to widen, no token
      # to hold, and `verify` runs the way it does on every other pull request.
      - if: steps.pinned.outputs.value != steps.push.outputs.digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          branch="companion-image-${VERSION}"
          file=deploy/cloud-init/src/lib/companion-image.ts

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch" origin/main
          sed -i "s|beacon-companion@sha256:[0-9a-f]\{64\}|beacon-companion@${DIGEST}|" "$file"

          git commit -q -m "build(cloud-init): epingle le compagnon ${VERSION}" -- "$file"
          # Forced because re-running a tag must update its branch rather than
          # fail on one that already exists.
          git push -q --force-with-lease origin "$branch"

          title="build(cloud-init): epingle le compagnon ${VERSION}"
          body=$(printf '%s\n' \
            "L'image \`${VERSION}\` vient d'etre publiee et le catalogue epinglait encore la precedente." \
            '' \
            'Tant que cette ligne ne bouge pas, les machines demarrent le compagnon' \
            "d'avant — et une Function qui attend deja son nouveau rapport ne publie" \
            'aucun point de jonction.' \
            '' \
            "Digest : \`${DIGEST}\`" \
            '' \
            'Branche poussee par `companion.yml`, apres la barriere du test de fumee.')

          # Pre-filled through the compare URL rather than left to be retyped:
          # what makes this worth reading is the paragraph saying what breaks
          # while the line has not moved, and a summary that asked for it to be
          # written by hand would get an empty body every time.
          encode() { printf '%s' "$1" | jq -sRr @uri; }
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
          url="${url}&title=$(encode "$title")&body=$(encode "$body")"

          {
            printf '## Le catalogue epingle encore l image precedente\n\n'
            printf 'Branche poussee : `%s`\n\n' "$branch"
            # The url is wrapped in <> because a markdown link ends at the first
            # `)`, and the title carries one: `build(cloud-init)`. `@uri` does
            # encode parentheses, so this changes nothing today — it is there so
            # that an encoder which stopped doing it would not silently truncate
            # the one link this summary exists to offer.
            printf '**[Ouvrir la pull request](<%s>)** — pre-remplie. Ouverte par un humain,\n' "$url"
            printf 'elle declenche `verify`, qui est une verification requise.\n\n'
            printf 'Sinon, depuis le depot :\n\n```\ngh pr create --base main --head %s\n```\n' "$branch"
          } >> "$GITHUB_STEP_SUMMARY"
