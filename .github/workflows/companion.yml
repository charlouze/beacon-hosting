name: companion

# A git tag, and nothing else. §10: publishing an image is one of the two paths
# that has no review, so it is deliberately a gesture and never a side effect of
# a merge.
on:
  push:
    tags: ['companion-v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Publishing, and nothing else. The pin is posed from a workstation by
# `companion:pin`, so this workflow writes nothing back to the repository and
# holds no right to.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx nx build companion

      # The barrier (§10). The image does not leave the runner if the round trip
      # or the refusal of an empty archive does not hold.
      - run: npx nx run companion:smoke

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `companion-v1` names the git tag, where the prefix says which artefact
      # of the repository is being published. The image is already called
      # beacon-companion, so carrying the prefix over would read
      # `beacon-companion:companion-v1`. The trigger above only ever fires on
      # `companion-v*`, so stripping it is total and needs no fallback.
      - id: version
        run: echo "value=${GITHUB_REF_NAME#companion-v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: push
        with:
          context: deploy/companion
          push: true
          tags: ghcr.io/charlouze/beacon-companion:${{ steps.version.outputs.value }}

      # The digest is what the cloud-init references, never the tag — and
      # `companion:pin` reads it back from the registry rather than copying it
      # from here. Printed all the same: a published image whose digest appears
      # nowhere in its own run is one nobody can check after the fact.
      - run: echo "digest ${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

      # This workflow used to push a branch re-pinning the digest, for a gap the
      # project paid for twice: once a companion published while the catalogue
      # kept the previous image, and on 2026-09-16 the reverse — worlds merged
      # against the companion of two days before, which restored the wrong world
      # and could close no session.
      #
      # Neither is caught here any more, deliberately. `verify` now refuses a
      # tree whose sources do not match the pinned image, which closes the gap
      # before a merge rather than reporting it after a publication. And a push
      # made with the `GITHUB_TOKEN` triggers no workflow, so a commit posed from
      # this runner would leave that very check without a run, on a repository
      # whose ruleset requires it.
      - env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          {
            echo "## Pose l'épingle depuis ton poste"
            echo
            echo '```'
            echo "nx run companion:pin -- $VERSION"
            echo '```'
            echo
            echo "Elle résout le digest, recalcule l'empreinte des sources, et écrit les"
            echo "deux lignes de companion-image.ts. Commite et pousse : verify tourne sur"
            echo "ton push, ce qu'un push de ce runner ne déclencherait pas."
          } >> "$GITHUB_STEP_SUMMARY"
